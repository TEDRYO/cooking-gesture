<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooking Assistant - ロールキャベツ(通信テスト版)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "Hiragino Sans", sans-serif;
  background: radial-gradient(circle at 50% 0%, #12203a 0%, #060912 70%);
  color: #e8eef5; overflow-x: hidden; min-height: 100vh;
}
#header {
  position: fixed; top: 0; left: 0; width: 100%;
  padding: 16px 24px; z-index: 100;
  background: rgba(6,12,24,0.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,229,255,0.25);
}
#title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
#title span { color: #00e5ff; }
#subtitle { font-size: 12px; color: #7a8ba3; margin-top: 2px; }
#progress-track {
  margin-top: 12px; height: 6px; width: 100%;
  background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
}
#progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #00e5ff, #7b5cff);
  box-shadow: 0 0 12px #00e5ff; border-radius: 3px;
  transition: width 0.5s ease;
}
#steps { padding: 150px 24px 200px; max-width: 720px; margin: 0 auto; }
.step {
  display: flex; gap: 20px; align-items: flex-start;
  margin-bottom: 24px; padding: 28px;
  background: rgba(20,32,56,0.55); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 18px; transition: all 0.4s ease;
  opacity: 0.4;
}
.step.active {
  opacity: 1;
  background: rgba(20,40,70,0.9);
  border: 1px solid #00e5ff;
  box-shadow: 0 0 30px rgba(0,229,255,0.35), inset 0 0 20px rgba(0,229,255,0.05);
  transform: scale(1.02);
}
.step.done { opacity: 0.55; }
.num {
  flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700;
  background: rgba(0,229,255,0.1); border: 2px solid rgba(0,229,255,0.4);
  color: #00e5ff;
}
.step.active .num {
  background: #00e5ff; color: #06121f;
  box-shadow: 0 0 20px #00e5ff;
}
.step.done .num { border-color: #4caf50; color: #4caf50; background: rgba(76,175,80,0.1); }
.body h2 { font-size: 22px; margin-bottom: 8px; }
.meta { display: flex; gap: 16px; margin-bottom: 12px; font-size: 13px; }
.meta .time { color: #00e5ff; }
.meta .tag { color: #ff9d5c; }
.desc { font-size: 16px; line-height: 1.7; color: #c5d2e3; }
.tip {
  margin-top: 12px; padding: 10px 14px; font-size: 13px;
  background: rgba(255,157,92,0.1); border-left: 3px solid #ff9d5c;
  border-radius: 6px; color: #ffcfa8;
}
#status {
  position: fixed; bottom: 20px; left: 20px; z-index: 100;
  padding: 12px 18px; font-size: 14px; border-radius: 30px;
  background: rgba(6,12,24,0.9); border: 1px solid rgba(0,229,255,0.3);
  color: #9fb3cc;
}
#status.on { border-color: #00e5ff; color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
#signal {
  position: fixed; top: 45%; left: 50%; transform: translateX(-50%);
  font-size: 72px; font-weight: 800; color: #00e5ff;
  opacity: 0; transition: opacity 0.2s; z-index: 200;
  text-shadow: 0 0 30px #00e5ff;
}
</style>
</head>
<body>

<div id="header">
  <div id="title">COOKING <span>ASSISTANT</span></div>
  <div id="subtitle">ロールキャベツ ／ 工程追従モード(通信テスト)</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="steps"></div>
<div id="signal"></div>
<div id="status">Pi5への接続待ち...</div>

<script>
const recipe = [
  { title: "キャベツを下ゆでする", time: "約8分", tag: "下ごしらえ",
    desc: "キャベツの葉を6枚はがし、熱湯でしんなりするまで2〜3分ゆでる。ざるに上げて冷ます。",
    tip: "芯の厚い部分は包丁でそぎ落とすと巻きやすい。" },
  { title: "肉だねを作る", time: "約5分", tag: "下ごしらえ",
    desc: "合いびき肉300g、みじん切り玉ねぎ1/2個、卵1個、パン粉大さじ3、塩こしょうを粘りが出るまで混ぜる。",
    tip: "玉ねぎは炒めずそのままでOK。冷たいまま混ぜると肉が締まる。" },
  { title: "肉だねを巻く", time: "約10分", tag: "成形",
    desc: "キャベツの葉に肉だねを6等分でのせ、手前から巻き、両端を折り込む。巻き終わりを楊枝でとめる。",
    tip: "きつめに巻くと煮崩れしにくい。" },
  { title: "鍋に並べて煮込む", time: "約25分", tag: "加熱",
    desc: "巻き終わりを下にして鍋に並べ、コンソメ・水400ml・ローリエを加え、落し蓋をして弱火で25分煮込む。",
    tip: "すき間なく並べると転がらず形が保てる。" },
  { title: "味を調えて仕上げる", time: "約5分", tag: "仕上げ",
    desc: "塩こしょうで味を調え、火を止める。器に盛り、煮汁をかけてお好みでパセリを散らす。",
    tip: "一度冷ますと味がしみて翌日はさらに美味しい。" }
];

const stepsEl = document.getElementById("steps");
recipe.forEach((r, i) => {
  const div = document.createElement("div");
  div.className = "step";
  div.innerHTML = `
    <div class="num">${i+1}</div>
    <div class="body">
      <div class="meta"><span class="time">⏱ ${r.time}</span><span class="tag"># ${r.tag}</span></div>
      <h2>${r.title}</h2>
      <div class="desc">${r.desc}</div>
      <div class="tip">💡 ${r.tip}</div>
    </div>`;
  stepsEl.appendChild(div);
});
const steps = document.querySelectorAll(".step");

const status = document.getElementById("status");
const signal = document.getElementById("signal");
const progress = document.getElementById("progress-fill");
let current = 0;

function showSignal(text) {
  signal.textContent = text;
  signal.style.opacity = 1;
  setTimeout(() => { signal.style.opacity = 0; }, 500);
}

function goTo(index) {
  current = Math.max(0, Math.min(steps.length - 1, index));
  steps.forEach((s, i) => {
    s.classList.toggle("active", i === current);
    s.classList.toggle("done", i < current);
  });
  steps[current].scrollIntoView({ behavior: "smooth", block: "center" });
  progress.style.width = ((current) / (steps.length - 1) * 100) + "%";
}

const socket = new WebSocket("wss://172.29.116.54:8765");

socket.onopen = () => {
  status.textContent = "Pi5と接続しました";
  status.className = "on";
};

socket.onmessage = (event) => {
  if (event.data === "next") {
    goTo(current + 1);
    showSignal("次へ ▼");
  }
};

socket.onerror = (error) => {
  status.textContent = "接続エラー(Console参照)";
  console.log("WebSocket接続エラー:", error);
};

socket.onclose = () => {
  status.textContent = "接続が切れました";
  status.className = "";
};

goTo(0);
</script>

</body>
</html>
